# LAN flow: the backstop. Every ~10 minutes (best-effort: GitHub often runs it hours apart), ask cbbl
# to sync any live LAN event. cbbl then makes sure the lan-live loop is running, and the loop keeps the
# real cadence (a sync every 3 minutes). With no live event cbbl answers at once. Vercel Hobby cron
# runs only once a day, hence Actions. GitHub pauses schedules after 60 days without a commit to this
# repo; "Sync now" on cbbl's /admin does the same thing on demand.
name: lan-poll
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync live LAN events
        env:
          CBBL_URL: ${{ secrets.CBBL_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          curl -fsS --max-time 90 -X POST -H "Authorization: Bearer $WORKER_SECRET" "$CBBL_URL/api/ingest/lan/sync"
          echo
