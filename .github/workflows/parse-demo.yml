# Public worker repo → unlimited standard-runner minutes. Only repository_dispatch can trigger it;
# no pull_request triggers, so forks can never run with these secrets.
name: parse-demo
on:
  repository_dispatch:
    types: [parse-demo]
permissions:
  contents: read
concurrency:
  group: parse-${{ github.event.client_payload.docId }}
  cancel-in-progress: false
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache-dependency-path: parser/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build parser + highlight renderer
        run: |
          cd parser
          go build -o ../worker/cbbl-parse ./cmd/cbbl-parse
          go build -o ../worker/cbbl-highlight ./cmd/cbbl-highlight
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Download, parse, report
        working-directory: worker
        env:
          DOC_ID: ${{ github.event.client_payload.docId }}
          DEMO_URL: ${{ github.event.client_payload.url }}
          DEMO_NAME: ${{ github.event.client_payload.demo }}
          CBBL_URL: ${{ secrets.CBBL_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          ALLOWED_HOSTS: ${{ vars.DEMO_URL_HOSTS }}
          DISCORD_MATCHES_WEBHOOK: ${{ secrets.DISCORD_MATCHES_WEBHOOK }}
          TRACKED_STEAM_IDS: ${{ vars.TRACKED_STEAM_IDS }}
        run: node src/parse-job.mjs
